[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "policylens"
version = "1.2.0"
description = "Evidence-first document intelligence for synthetic life-insurance products"
authors = [{name = "Arkamitra Bhattacharyya"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.63,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
  "openai>=1.50,<3",
  "python-dotenv>=1.0,<2",
]

[project.urls]
Repository = "https://github.com/arkamitrab/PolicyLens"


[tool.setuptools.packages.find]
where = ["src"]
