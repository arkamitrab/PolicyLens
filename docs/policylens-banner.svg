<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">PolicyLens</title>
  <description id="description">Evidence-first document intelligence for insurance product teams.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f3a"/>
      <stop offset="1" stop-color="#0b6b68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#background)"/>
  <circle cx="1045" cy="55" r="150" fill="#20a39e" opacity="0.18"/>
  <circle cx="1100" cy="310" r="210" fill="#2878a8" opacity="0.17"/>
  <g transform="translate(78 72)">
